# File: docker-compose.yml (in project root: omnicore-ai-platform/)
# Single file used for both dev and prod, adapted via .env files and commenting volumes

services:
  # --- Database Service (PostgreSQL) ---
  db:
    image: postgres:15-alpine # Specific image version
    container_name: omnicore_db
    volumes:
      # Named volume for persistent data (Keep for Dev & Prod)
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      # Load DB credentials from specified .env file (.env or .env.production)
      - .env
    networks:
      - app-network
    restart: unless-stopped # Keep DB running
    healthcheck: # Ensure DB is ready before dependent services start
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      # Expose port only within the Docker network
      - "5432"

  # --- Database Admin Tool (PgAdmin) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: omnicore_pgadmin
    env_file:
      # Load PgAdmin credentials from specified .env file
      - .env
    ports:
      # Map host port 5050 to container port 80 (Keep for Dev & Prod)
      - "5050:80"
    volumes:
      # Persist PgAdmin data (Keep for Dev & Prod)
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      db: # Wait for DB to be healthy
        condition: service_healthy
    restart: unless-stopped

  # --- Backend Service (Django) ---
  backend:
    build:
      context: ./backend # Correct path to backend folder
      dockerfile: Dockerfile # Assumes Dockerfile is named 'Dockerfile'
    container_name: omnicore_backend
    # Command is specified in the backend/Dockerfile CMD instruction
    volumes:
      # === DEV vs PROD CHANGE ===
      # FOR DEVELOPMENT: Mount local code folder to /app inside container.
      - ./backend:/app
      # FOR PRODUCTION: Comment out or REMOVE the above line.

      # === DEV vs PROD CHANGE (PoC Specific & Security) ===
      # FOR DEVELOPMENT PoC ONLY: Mount Docker socket (SECURITY RISK).
      - /var/run/docker.sock:/var/run/docker.sock
      # FOR PRODUCTION: Comment out or REMOVE the above line COMPLETELY.
    env_file:
      # Load Django settings, DB URL, etc., from specified .env file
      - .env
    networks:
      - app-network
    depends_on:
      db: # Wait for DB to be healthy
        condition: service_healthy
      # No explicit depends_on stt_service needed if backend handles its status via API
    ports:
      # Map to host for easier development access
      - "${BACKEND_SERVICE_PORT:-8000}:8000"
    restart: unless-stopped

  # --- AI Service (STT - FastAPI) ---
  stt_service:
    build:
      context: ./ai_services/stt_service # Correct path
      dockerfile: Dockerfile # Assumes Dockerfile is named 'Dockerfile'
    container_name: ${STT_CONTAINER_NAME:-omnicore_stt_service_container_dev} # Name from .env
    # Command specified in ai_services/stt_service/Dockerfile CMD
    volumes:
      # === DEV vs PROD CHANGE ===
      # FOR DEVELOPMENT: Mount local code folder.
      - ./ai_services/stt_service:/app
      # FOR PRODUCTION: Comment out or REMOVE the above line.

      # Optional: Mount persistent cache for AI models if needed
      # - stt_models:/root/.cache/huggingface
    env_file:
      # Loads STT_SERVICE_PORT, etc., from specified .env file
      - .env
    networks:
      - app-network
    # === DEV vs PROD CHANGE (Behavior) ===
    # FOR DEVELOPMENT PoC: Explicit control via API
    restart: "no"
    # FOR PRODUCTION: Change to 'unless-stopped' if service should always run
    # restart: unless-stopped
    stop_grace_period: 15s # Allow time for graceful shutdown
    expose:
      # Expose STT port only within Docker network (accessed by backend)
      - "${STT_SERVICE_PORT:-8001}" # Port from .env

  # --- Frontend Service (React served by Nginx) ---
  frontend:
    build:
      context: ./frontend # Correct path to frontend folder
      dockerfile: Dockerfile # Assumes Dockerfile is named 'Dockerfile'
    container_name: omnicore_frontend
    ports:
      # Map host port (from .env or default 5173) to container port 80 (Nginx)
      - "${FRONTEND_PORT:-5174}:80"
    networks:
      - app-network
    depends_on:
      - backend # Nginx needs backend service available for API proxying
    restart: unless-stopped # Keep frontend running

# --- Networks ---
# Define a custom bridge network allowing services to communicate by name
networks:
  app-network:
    driver: bridge

# --- Volumes ---
# Define named volumes for persistent data (KEEP FOR BOTH DEV & PROD)
volumes:
  postgres_data:
    driver: local # Use default local driver
  pgadmin_data:
    driver: local
  # Define model cache volume if used above
  # stt_models:
  #   driver: local