server {
    listen 80;
    server_name localhost; # Or your domain in production

    # Increase client buffer size if needed for large uploads later
    # client_max_body_size 100M;

    # Serve React App static files from the root
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # Essential for SPAs using React Router
    }

    # Reverse Proxy for API calls to the Django backend service
    # All requests starting with /api/ will be forwarded
    location /api/ {
        # If Django URLs don't include '/api/', uncomment rewrite:
        # rewrite ^/api/(.*)$ /$1 break;

        # Proxy to the Django backend service container
        # 'backend' MUST match the service name in docker-compose.yml
        # 8000 MUST match the port Gunicorn runs on inside the backend container
        proxy_pass http://backend:8000;

        # Set headers to pass information to the backend
        proxy_set_header Host $host; # Pass the original host header
        proxy_set_header X-Real-IP $remote_addr; # Pass the real client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Pass proxy chain IPs
        proxy_set_header X-Forwarded-Proto $scheme; # Pass the original scheme (http/https)

        # Optional: Adjust timeouts if backend requests take long
        # proxy_connect_timeout       60s;
        # proxy_send_timeout          60s;
        # proxy_read_timeout          60s;

        # Avoid potential redirect issues
        proxy_redirect off;
    }

    # Optional: Add custom error pages
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     root /usr/share/nginx/html;
    # }

    # Optional: Enable Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
